name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: tmux and shellcheck
        run: sudo apt-get update && sudo apt-get install -y tmux shellcheck
      - name: gofmt, vet, test
        run: scripts/test.sh
      - name: shellcheck
        run: shellcheck scripts/*.sh probe/*.sh contrib/*.bash
